# Coolify-specific definition for an existing PostgreSQL resource.
# Coolify consumes exclude_from_hc before invoking Docker Compose.
x-storage: &storage
  NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?Paste the existing PostgreSQL internal connection URL}
  NUXT_UPLOAD_STORAGE: r2
  NUXT_UPLOAD_DIR: /app/data/uploads
  NUXT_R2_ACCOUNT_ID: ${NUXT_R2_ACCOUNT_ID:-}
  NUXT_R2_ENDPOINT: ${NUXT_R2_ENDPOINT:-}
  NUXT_R2_ACCESS_KEY_ID: ${NUXT_R2_ACCESS_KEY_ID:?Set the R2 access key ID}
  NUXT_R2_SECRET_ACCESS_KEY: ${NUXT_R2_SECRET_ACCESS_KEY:?Set the R2 secret access key}
  NUXT_R2_BUCKET: ${NUXT_R2_BUCKET:?Set the existing R2 bucket}
  NUXT_R2_PREFIX: ${NUXT_R2_PREFIX:-tebu/media}

x-app: &app
  <<: *storage
  NODE_ENV: production
  NUXT_DEPLOYMENT_MODE: production
  NUXT_PUBLIC_DEMO: 'false'
  NUXT_PUBLIC_TESTING_CALENDAR: 'false'
  NUXT_TRUST_PROXY: 'true'
  NUXT_SITE_URL: ${NUXT_SITE_URL:?Set the actual public HTTPS origin you will use}
  NUXT_ADMIN_KEY: ${NUXT_ADMIN_KEY:?Set a random admin key of at least 32 characters}
  NUXT_PUBLIC_MERCHANT_NAME: ${NUXT_PUBLIC_MERCHANT_NAME:-Tebu Drop}
  NUXT_PUBLIC_SUPPORT_WHATSAPP: ${NUXT_PUBLIC_SUPPORT_WHATSAPP:-}
  NUXT_PUBLIC_DUITNOW_QR: ${NUXT_PUBLIC_DUITNOW_QR:-}

x-backup: &backup
  TEBU_BACKUP_ENCRYPTION_KEY: ${TEBU_BACKUP_ENCRYPTION_KEY:?Copy the existing backup encryption key}
  TEBU_BACKUP_DIRECTORY: /backups
  TEBU_BACKUP_KEEP: ${TEBU_BACKUP_KEEP:-14}
  TEBU_BACKUP_INTERVAL_SECONDS: ${TEBU_BACKUP_INTERVAL_SECONDS:-86400}

services:
  release:
    build:
      context: .
      target: operations
    environment:
      <<: [*app, *backup]
    volumes:
      - uploads:/app/data/uploads
      - backups:/backups
    restart: 'no'
    exclude_from_hc: true
  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *app
      NUXT_TELEGRAM_BOT_TOKEN: ${NUXT_TELEGRAM_BOT_TOKEN:-}
      NUXT_TELEGRAM_CHAT_ID: ${NUXT_TELEGRAM_CHAT_ID:-}
    expose:
      - '3000'
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
  backup:
    build:
      context: .
      target: operations
    environment:
      <<: [*storage, *backup]
    volumes:
      - uploads:/app/data/uploads
      - backups:/backups
    command: [node, --import, tsx, scripts/backup.ts, --schedule]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/backup-health.ts]
      interval: 60s
      timeout: 10s
      start_period: 5m
      retries: 3
    depends_on:
      release:
        condition: service_completed_successfully

volumes:
  uploads:
  backups:
