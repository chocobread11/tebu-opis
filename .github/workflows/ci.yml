name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_PUBLIC_DEMO: "true"

jobs:
  verify:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: prisma/action-prisma@v0.6.0
        with:
          prisma-version: "7"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build server target
        run: npm run build
      - name: Build static demo target
        run: npm run generate

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse obvious token material
        run: |
          if git grep -nI -E "(NUXT_(ADMIN_KEY|DATABASE_URL)=[^ \"'<]+)" -- ':!*.example' ':!.github/*'; then
            echo "::error::Committed files contain material that looks like live secrets. Redact them."
            exit 1
          fi
