services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tebu
      POSTGRES_DB: tebu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tebu -d tebu']
      interval: 5s
      timeout: 5s
      retries: 12
  release:
    build:
      context: .
      target: operations
    env_file: .env.production
    volumes:
      - uploads:/app/data/uploads
      - backups:/backups
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: .
      target: runtime
    env_file: .env.production
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      release:
        condition: service_completed_successfully
  backup:
    build:
      context: .
      target: operations
    env_file: .env.production
    volumes:
      - uploads:/app/data/uploads
      - backups:/backups
    command: [node, --import, tsx, scripts/backup.ts, --schedule]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/backup-health.ts]
      interval: 60s
      timeout: 10s
      start_period: 5m
      retries: 3
    depends_on:
      release:
        condition: service_completed_successfully
volumes:
  database:
  uploads:
  backups:
